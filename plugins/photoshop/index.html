<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    html, body, #root {
      box-sizing: border-box;
      height: 100%;
      margin: 0;
    }
    body {
      background: var(--uxp-host-background-color);
      color: var(--uxp-host-text-color);
      font-family: var(--uxp-host-font-family);
      overflow: auto;
    }
    .container {
      padding: 12px;
    }
    input, select, textarea {
      background: var(--uxp-host-background-color);
      border: 1px solid var(--uxp-host-border-color);
      border-radius: 4px;
      color: var(--uxp-host-text-color);
      padding: 6px;
    }
    .error-label {
      color: #ff6b6b;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="dist/librarys.js"></script>
  <script src="dist/index.js"></script>
  <script src="run.js"></script>
</body>
</html>
